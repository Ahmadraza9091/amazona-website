
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # CI JOB
  # ============================================================
  build:
    name: CI - Build, Scan & Test
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout Source Code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Node.js 20 LTS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # 3. Install Backend Dependencies
      # ============================================================
      - name: Install backend dependencies
        run: npm install


      # ============================================================
      # 4. Install Frontend Dependencies
      # ============================================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install


      # ============================================================
      # 5. Build Frontend
      # ============================================================
      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build


      # ============================================================
      # 6. Build Docker Images
      # ============================================================
      - name: Build Docker images
        run: docker compose build


      # ============================================================
      # 7. Trivy Security Scan - Backend
      # ============================================================
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'image'
          image-ref: amazona-backend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-dirs: "**/node_modules"


      # ============================================================
      # 8. Trivy Security Scan - Frontend
      # ============================================================
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'image'
          image-ref: amazona-frontend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-dirs: "**/node_modules"


      # ============================================================
      # 9. Start Application
      # ============================================================
      - name: Start application
        run: docker compose up -d


      # ============================================================
      # 10. Check Container Status
      # ============================================================
      - name: Check running containers
        run: docker compose ps


      # ============================================================
      # 11. Wait for Application (with retry loop)
      # ============================================================
      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/products > /dev/null 2>&1; then
              echo "Backend is up!"
              break
            fi
            echo "Attempt $i/30 — waiting 3s..."
            sleep 3
          done


      # ============================================================
      # 12. Test Frontend
      # ============================================================
      - name: Test frontend
        run: curl --fail http://localhost:3000


      # ============================================================
      # 13. Test Backend API
      # ============================================================
      - name: Test backend
        run: curl --fail http://localhost:5000/api/products


      # ============================================================
      # 14. Stop Containers
      # ============================================================
      - name: Stop containers
        if: always()
        run: docker compose down


  # ============================================================
  # DOCKER HUB JOB
  # ============================================================
  docker-publish:
    name: Publish Images to Docker Hub
    runs-on: ubuntu-latest

    needs: build

    # Only publish on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


     


      # ============================================================
      # 3. Set up Docker Buildx
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # 4. Login to Docker Hub
      # ============================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # 5. Build Docker Images
      # ============================================================
      - name: Build Docker images
        run: docker compose build


      # ============================================================
      # 6. Tag Backend Image
      # ============================================================
      - name: Tag backend image
        run: |
          docker tag amazona-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:latest

          docker tag amazona-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:${{ github.sha }}


      # ============================================================
      # 7. Tag Frontend Image
      # ============================================================
      - name: Tag frontend image
        run: |
          docker tag amazona-frontend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:latest

          docker tag amazona-frontend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:${{ github.sha }}


      # ============================================================
      # 8. Push Backend Image
      # ============================================================
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:${{ github.sha }}


      # ============================================================
      # 9. Push Frontend Image
      # ============================================================
      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:${{ github.sha }}


  # ============================================================
  # CD JOB - DEPLOY TO EC2
  # ============================================================
  deploy:
    name: CD - Deploy to EC2
    runs-on: ubuntu-latest

    # Deploy only after Docker Hub successfully receives images
    needs: docker-publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Copy Docker Compose to EC2
      # ============================================================
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/amazona"


      # ============================================================
      # 3. Deploy Application to EC2
      # ============================================================
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |

            # ======================================================
            # Go to application directory
            # ======================================================
            cd ~/amazona


            # ======================================================
            # Login to Docker Hub
            # ======================================================
            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin


            # ======================================================
            # Pull latest images from Docker Hub
            # ======================================================
            docker pull "$DOCKERHUB_USERNAME/amazona-backend:latest"
            docker pull "$DOCKERHUB_USERNAME/amazona-frontend:latest"


            # ======================================================
            # Tag Docker Hub images with local compose names
            # ======================================================
            docker tag \
              "$DOCKERHUB_USERNAME/amazona-backend:latest" \
              amazona-backend:latest

            docker tag \
              "$DOCKERHUB_USERNAME/amazona-frontend:latest" \
              amazona-frontend:latest


            # ======================================================
            # Stop old application
            # ======================================================
            docker compose -f docker-compose.prod.yml down


            # ======================================================
            # Start new application
            # --no-build prevents EC2 from building images
            # ======================================================
            docker compose -f docker-compose.prod.yml up -d --no-build


            # ======================================================
            # Show running containers
            # ======================================================
            docker compose -f docker-compose.prod.yml ps


            # ======================================================
            # Remove unused Docker images
            # ======================================================
            docker image prune -f


            # ======================================================
            # Logout from Docker Hub
            # ======================================================
            docker logout
