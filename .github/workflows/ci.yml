name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout Source Code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16


      # ============================================================
      # 3. Install Backend Dependencies
      # ============================================================
      - name: Install backend dependencies
        run: npm install


      # ============================================================
      # 4. Install Frontend Dependencies
      # ============================================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install


      # ============================================================
      # 5. Build Frontend
      # ============================================================
      - name: Build frontend
        working-directory: frontend
        run: npm run build


      # ============================================================
      # 6. Build Docker Images
      # ============================================================
      - name: Build Docker images
        run: docker compose build


    # ============================================================
      # 7. Security Scan - Backend Image
      # ============================================================
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: amazona-backend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      # ============================================================
      # 8. Security Scan - Frontend Image
      # ============================================================
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: amazona-frontend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      # ============================================================
      # 9. Start Application
      # ============================================================
      - name: Start application
        run: docker compose up -d


      # ============================================================
      # 10. Check Container Status
      # ============================================================
      - name: Check running containers
        run: docker compose ps


      # ============================================================
      # 11. Wait for Application
      # ============================================================
      - name: Wait for application
        run: sleep 15


      # ============================================================
      # 12. Test Frontend
      # ============================================================
      - name: Test frontend
        run: curl --fail http://localhost:3000


      # ============================================================
      # 13. Test Backend API
      # ============================================================
      - name: Test backend
        run: curl --fail http://localhost:5000/api/products


      # ============================================================
      # 14. Stop Containers
      # ============================================================
      - name: Stop containers
        if: always()
        run: docker compose down