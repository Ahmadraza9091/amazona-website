
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:

  deploy:
    name: Deploy to Server

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Docker Buildx
      # ============================================================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # 3. Login to Docker Hub
      # ============================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # 4. Build Backend Image
      # ============================================================
      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:latest \
            .


      # ============================================================
      # 5. Build Frontend Image
      # ============================================================
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:latest \
            ./frontend


      # ============================================================
      # 6. Push Backend Image
      # ============================================================
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:latest


      # ============================================================
      # 7. Push Frontend Image
      # ============================================================
      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:latest


      # ============================================================
      # 8. Setup SSH
      # ============================================================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/server_key

          chmod 600 ~/.ssh/server_key

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts


      # ============================================================
      # 9. Deploy to Server
      # ============================================================
      - name: Deploy application
        run: |
          ssh -i ~/.ssh/server_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

            set -e

            echo "======================================"
            echo "Starting Deployment"
            echo "======================================"


            # ------------------------------------------------------
            # Check Docker
            # ------------------------------------------------------
            if ! command -v docker >/dev/null 2>&1; then

              echo "Docker not found."
              echo "Installing Docker..."

              sudo apt-get update

              sudo apt-get install -y \
                ca-certificates \
                curl \
                gnupg


              sudo install -m 0755 -d /etc/apt/keyrings


              curl -fsSL \
                https://download.docker.com/linux/ubuntu/gpg \
                | sudo gpg --dearmor \
                -o /etc/apt/keyrings/docker.gpg


              sudo chmod a+r \
                /etc/apt/keyrings/docker.gpg


              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list \
                > /dev/null


              sudo apt-get update


              sudo apt-get install -y \
                docker-ce \
                docker-ce-cli \
                containerd.io \
                docker-buildx-plugin \
                docker-compose-plugin


              sudo systemctl enable docker
              sudo systemctl start docker

            fi


            # ------------------------------------------------------
            # Verify Docker
            # ------------------------------------------------------
            echo "Docker:"
            sudo docker --version

            echo "Docker Compose:"
            sudo docker compose version


            # ------------------------------------------------------
            # Login to Docker Hub
            # ------------------------------------------------------
            echo "Logging into Docker Hub..."

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              sudo docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin


            # ------------------------------------------------------
            # Application directory
            # ------------------------------------------------------
            cd ~/amazona-website


            # ------------------------------------------------------
            # Pull latest images
            # ------------------------------------------------------
            echo "Pulling backend image..."

            sudo docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/amazona-backend:latest


            echo "Pulling frontend image..."

            sudo docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/amazona-frontend:latest


            # ------------------------------------------------------
            # Stop old application
            # ------------------------------------------------------
            echo "Stopping old containers..."

            sudo docker compose down || true


            # ------------------------------------------------------
            # Start new application
            # ------------------------------------------------------
            echo "Starting new containers..."

            sudo docker compose up -d


            # ------------------------------------------------------
            # Container status
            # ------------------------------------------------------
            echo "Container status:"

            sudo docker compose ps


            # ------------------------------------------------------
            # Cleanup
            # ------------------------------------------------------
            echo "Cleaning unused images..."

            sudo docker image prune -f


            echo "======================================"
            echo "Deployment Successful"
            echo "======================================"

          EOF


      # ============================================================
      # 10. Final Verification
      # ============================================================
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/server_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd ~/amazona-website && sudo docker compose ps"
